name: ci

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  build:
    name: 编译与单测
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: 编译打包（跳过需要外部 API Key 的测试）
        run: ./mvnw -B -DskipTests package
      - name: 上传 jar
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/*.jar

  loadtest-smoke:
    name: 压测冒烟（阈值门禁）
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: 构建镜像
        run: docker compose build app

      - name: 启动依赖与压测实例
        run: |
          docker compose up -d mysql redis
          docker compose --profile loadtest up -d app-loadtest

      - name: 等待健康检查
        run: |
          for i in $(seq 1 60); do
            status=$(docker inspect -f '{{.State.Health.Status}}' tlias-app-loadtest 2>/dev/null || echo starting)
            echo "health=$status"
            [ "$status" = "healthy" ] && exit 0
            sleep 5
          done
          docker logs tlias-app-loadtest --tail 100
          exit 1

      - name: k6 冒烟（阈值不达标即中断流水线）
        run: |
          docker run --rm --network host -i \
            -v "$PWD/loadtest:/scripts:ro" \
            -e BASE_URL=http://localhost:8081 \
            grafana/k6:latest run /scripts/k6-smoke.js

      - name: 打印容器日志
        if: failure()
        run: docker logs tlias-app-loadtest --tail 200
